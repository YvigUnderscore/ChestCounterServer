name: Build ChestCounter.exe
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: dotnet publish src/ChestCounter/ChestCounter.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: ChestCounter
          path: dist/ChestCounter.exe
      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ChestCounter.exe
          body_path: RELEASE_NOTES.md
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Tests
        working-directory: server
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q
      - name: Docker image
        run: docker build -f server/Dockerfile -t chestcounter-server:latest .
      - name: Save the image (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: docker save chestcounter-server:latest -o chestcounter-server.tar
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: chestcounter-server
          path: chestcounter-server.tar
  # The server image goes to the release too (for Portainer: Images -> Import), once the exe job has created it.
  release-image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chestcounter-server
      - name: Attach the server image to the release
        uses: softprops/action-gh-release@v2
        with:
          files: chestcounter-server.tar
